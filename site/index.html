  <head>
    <meta charset="UTF-8" />

    <title>Homebot — Siri for your Grok Bot</title>
    <script>
      // Set the theme before the first paint, so a dark page doesn't flash white.
      try {
        var t = localStorage.getItem("hb-theme");
        if (t === "dark" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
